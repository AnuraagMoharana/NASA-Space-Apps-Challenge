/* --------------------------------------------------------------------------

   -------------------------------------------------------------------------- */

  padding-top: 1rem;
}

}

/* --------------------------------------------------------------------------
   ROTATING WIRE-MESH PLANET — subtle background exhibit element
   -------------------------------------------------------------------------- */

.wire-planet {
  position: absolute;
  width: min(46vw, 620px);
  height: min(46vw, 620px);
  right: -4%;
  top: 50%;
  transform: translateY(-50%);
  opacity: .24;
  pointer-events: none;
  z-index: 0;
  overflow: visible;
}

.wire-planet svg {
  width: 100%;
  height: 100%;
  overflow: visible;
}

.wire-planet-sphere {
  transform-origin: 50% 50%;
  animation: wirePlanetRotate 32s linear infinite;
}

.wire-planet-ring {
  transform-origin: 50% 50%;
  animation: wirePlanetRing 42s linear infinite;
}

@keyframes wirePlanetRotate {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}

@keyframes wirePlanetRing {
  from { transform: rotate(-8deg); }
  to { transform: rotate(352deg); }
}

@media (prefers-reduced-motion: reduce) {
  .wire-planet-sphere,
  .wire-planet-ring { animation: none; }
}

@media (max-width: 1024px) {
  .wire-planet {
    width: 480px;
    height: 480px;
    right: -12%;
    opacity: .18;
  }
}

@media (max-width: 640px) {
  .wire-planet {
    width: 360px;
    height: 360px;
    right: -22%;
    top: 28%;
    opacity: .13;
  }
}
  

/* ==========================================================================
   BALANCED 4-TONE EXHIBITION PALETTE
   Cream / Ivory / Stone / Charcoal with restrained coral accents
   ========================================================================== */

:root {
  --tone-cream: #F1EFE9;
  --tone-ivory: #FAF9F5;
  --tone-stone: #E1DED5;
  --tone-charcoal: #242321;

}

    <!-- JAVASCRIPT LOGIC ENGINE -->
    <script>
        // -------------------------------------------------------------
        // 1. THREE.JS TECHNICAL BLUEPRINT WIREFRAME SATURN
        // Renders warm stone/charcoal museum wireframe on warm cream canvas
        // -------------------------------------------------------------
        const heroContainer = document.getElementById('canvas-container');
        const heroScene = new THREE.Scene();

        const heroCamera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        heroCamera.position.set(0, 0, 12);

        const heroRenderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        heroRenderer.setSize(window.innerWidth, window.innerHeight);
        heroRenderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        heroContainer.appendChild(heroRenderer.domElement);

        // SATURN MODEL GROUP
        const saturnGroup = new THREE.Group();

        // Core Wireframe Sphere (Charcoal technical mesh)
        const saturnGeo = new THREE.IcosahedronGeometry(2.2, 4);
        const saturnMat = new THREE.MeshBasicMaterial({
            color: 0x2A2927,
            wireframe: true,
            transparent: true,
            opacity: 0.35
        });
        const saturnMesh = new THREE.Mesh(saturnGeo, saturnMat);
        saturnGroup.add(saturnMesh);

        // Inner solid core mask (Cream filled to occlude back wireframes)
        const innerGeo = new THREE.SphereGeometry(2.15, 32, 32);
        const innerMat = new THREE.MeshBasicMaterial({
            color: 0xF8F7F2,
            transparent: true,
            opacity: 0.95
        });
        const innerMesh = new THREE.Mesh(innerGeo, innerMat);
        saturnGroup.add(innerMesh);

        // SATURN RINGS WIREFRAME (Multi-ring layers)
        function createRing(innerRadius, outerRadius, opacity, color = 0x2A2927) {
            const ringGeo = new THREE.RingGeometry(innerRadius, outerRadius, 128, 8);
            const ringMat = new THREE.MeshBasicMaterial({
                color: color,
                wireframe: true,
                transparent: true,
                opacity: opacity,
                side: THREE.DoubleSide
            });
            const ringMesh = new THREE.Mesh(ringGeo, ringMat);
            ringMesh.rotation.x = Math.PI / 2;
            return ringMesh;
        }

        const ringA = createRing(3.2, 4.4, 0.40, 0x2A2927);
        const ringB = createRing(2.6, 3.0, 0.55, 0xD95338); // Terracotta ring layer
        const ringC = createRing(4.5, 5.0, 0.20, 0x787672);

        saturnGroup.add(ringA);
        saturnGroup.add(ringB);
        saturnGroup.add(ringC);

        // Set Saturn Axial Tilt (26.73 degrees = ~0.466 rad)
        saturnGroup.rotation.z = 0.22;
        saturnGroup.rotation.x = 0.42;

        heroScene.add(saturnGroup);

        // CELESTIAL BACKGROUND DUST PARTICLES
        const particleCount = 800;
        const particleGeo = new THREE.BufferGeometry();
        const particlePositions = new Float32Array(particleCount * 3);

        for (let i = 0; i < particleCount * 3; i += 3) {
            particlePositions[i] = (Math.random() - 0.5) * 80;
            particlePositions[i + 1] = (Math.random() - 0.5) * 80;
            particlePositions[i + 2] = (Math.random() - 0.5) * 80;
        }

        particleGeo.setAttribute('position', new THREE.BufferAttribute(particlePositions, 3));
        const particleMat = new THREE.PointsMaterial({
            color: 0x787672,
            size: 0.03,
            transparent: true,
            opacity: 0.35
        });
        const particleSystem = new THREE.Points(particleGeo, particleMat);
        heroScene.add(particleSystem);

        // -------------------------------------------------------------
        // 2. CONTINUOUS SCROLL TIMELINE CONTROLLER
        // Calculates normalized scroll progress from 0.00 to 1.00 strictly
        // -------------------------------------------------------------
        let targetProgress = 0;
        let currentProgress = 0;

        const scrollTrack = document.getElementById('scroll-track');
        const titleBlock = document.getElementById('title-block');
        const relicLabel = document.getElementById('relic-label');
        const subTitle = document.getElementById('sub-title');
        const heroActions = document.getElementById('hero-actions');
        const mainHeader = document.getElementById('main-header');
        const telemetryHud = document.getElementById('telemetry-hud');
        const initialPrompt = document.getElementById('initial-prompt');
        const timelineProgressBar = document.getElementById('timeline-progress-bar');

        function updateScrollProgress() {
            if (!scrollTrack) return;
            const trackRect = scrollTrack.getBoundingClientRect();
            const maxScroll = scrollTrack.offsetHeight - window.innerHeight;
            const scrolled = -trackRect.top;
            let p = scrolled / maxScroll;
            targetProgress = Math.max(0, Math.min(1, p));
        }

        window.addEventListener('scroll', updateScrollProgress, { passive: true });
        updateScrollProgress();

        const clock = new THREE.Clock();

        function renderHeroScene() {
            requestAnimationFrame(renderHeroScene);

            // Lerp currentProgress towards targetProgress for smooth 60fps cinematic interpolation
            currentProgress += (targetProgress - currentProgress) * 0.08;

            const elapsedTime = clock.getElapsedTime();

            // Update bottom progress indicator bar
            if (timelineProgressBar) {
                timelineProgressBar.style.width = `${Math.min(100, currentProgress * 100)}%`;
            }

            // Initial scroll prompt fade out
            if (currentProgress < 0.04) {
                initialPrompt.style.opacity = (1 - currentProgress / 0.04).toString();
            } else {
                initialPrompt.style.opacity = '0';
            }

            // SATURN ROTATION & POSITION TIMELINE MATRIX:
            
            let saturnRotY = 0;
            let saturnScale = 1.0;
            let saturnX = 0;

            if (currentProgress <= 0.20) {
                // 0.00 - 0.20: Centered, 0° rotation, scale 1.0
                saturnRotY = 0;
                saturnScale = 1.0;
                saturnX = 0;
            } else if (currentProgress <= 0.40) {
                // 0.20 - 0.40: Smooth rotation to 5° (0.087 rad)
                const norm = (currentProgress - 0.20) / 0.20;
                saturnRotY = norm * (5 * Math.PI / 180);
                saturnScale = 1.0;
                saturnX = 0;
            } else if (currentProgress <= 0.60) {
                // 0.40 - 0.60: Smooth rotation to 10° (0.174 rad)
                const norm = (currentProgress - 0.40) / 0.20;
                saturnRotY = (5 + norm * 5) * (Math.PI / 180);
                saturnScale = 1.0;
                saturnX = 0;
            } else if (currentProgress <= 0.75) {
                // 0.60 - 0.75: Smooth rotation to 15° (0.261 rad)
                const norm = (currentProgress - 0.60) / 0.15;
                saturnRotY = (10 + norm * 5) * (Math.PI / 180);
                saturnScale = 1.0;
                saturnX = 0;
            } else if (currentProgress <= 0.90) {
                // 0.75 - 0.90: Saturn scales down (~0.65x) and moves right
                const norm = (currentProgress - 0.75) / 0.15;
                saturnRotY = (15 + norm * 10) * (Math.PI / 180);
                saturnScale = 1.0 - norm * 0.35;
                saturnX = norm * (window.innerWidth < 768 ? 0.3 : 2.2);
            } else {
                // 0.90 - 1.00+: Final position right + continuous slow ambient spin
                saturnRotY = (25 * Math.PI / 180) + (elapsedTime * 0.08);
                saturnScale = 0.65;
                saturnX = (window.innerWidth < 768 ? 0.3 : 2.2);
            }

            // Apply transformations
            saturnGroup.rotation.y = saturnRotY;
            saturnGroup.scale.set(saturnScale, saturnScale, saturnScale);
            saturnGroup.position.x = saturnX;

            // Background star drift
            particleSystem.rotation.y = elapsedTime * 0.015;

            // EDITORIAL TEXT TIMELINE MATRIX:
            let titleOpacity = 0;
            let titleTranslateX = -40;
            let labelOpacity = 0;
            let subTextOpacity = 0;
            let actionsOpacity = 0;
            let headerOpacity = 0;
            let telemetryOpacity = 0;

            if (currentProgress < 0.60) {
                // STRICT RULE: Title MUST remain completely invisible during first 2 scroll phases
                titleOpacity = 0;
                titleTranslateX = -40;
            } else if (currentProgress <= 0.75) {
                // 0.60 - 0.75: Title slowly fades from 0 to 1 and moves to editorial position
                const norm = (currentProgress - 0.60) / 0.15;
                titleOpacity = norm;
                titleTranslateX = -40 * (1 - norm);
            } else {
                titleOpacity = 1;
                titleTranslateX = 0;
            }

            if (currentProgress > 0.75 && currentProgress <= 0.90) {
                const norm = (currentProgress - 0.75) / 0.15;
                labelOpacity = norm;
                subTextOpacity = norm;
            } else if (currentProgress > 0.90) {
                labelOpacity = 1;
                subTextOpacity = 1;
                const norm = Math.min(1, (currentProgress - 0.90) / 0.10);
                actionsOpacity = norm;
                headerOpacity = norm;
                telemetryOpacity = norm;
            }

            // Apply DOM styles
            titleBlock.style.opacity = titleOpacity.toFixed(3);
            titleBlock.style.transform = `translate3d(${titleTranslateX}px, 0, 0)`;
            relicLabel.style.opacity = labelOpacity.toFixed(3);
            subTitle.style.opacity = subTextOpacity.toFixed(3);
            heroActions.style.opacity = actionsOpacity.toFixed(3);
            mainHeader.style.opacity = headerOpacity.toFixed(3);
            telemetryHud.style.opacity = telemetryOpacity.toFixed(3);

            // Responsive positioning for title block
            if (window.innerWidth >= 768) {
                titleBlock.style.top = '28%';
                titleBlock.style.left = '10%';
            } else {
                titleBlock.style.top = '16%';
                titleBlock.style.left = '6%';
            }

            heroRenderer.render(heroScene, heroCamera);
        }

        requestAnimationFrame(renderHeroScene);

        // -------------------------------------------------------------
        // 3. AUDIO SYNTHESIZER & SPECTROGRAM CANVAS
        // -------------------------------------------------------------
        let audioCtx = null;
        let oscillator = null;
        let isAudioPlaying = false;

        const specCanvas = document.getElementById('spectrogram-canvas');
        const specCtx = specCanvas ? specCanvas.getContext('2d') : null;

        function resizeCanvas() {
            if (specCanvas) {
                specCanvas.width = specCanvas.clientWidth;
                specCanvas.height = specCanvas.clientHeight;
            }
        }
        resizeCanvas();

        function toggleAudioSynth() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }

            if (!isAudioPlaying) {
                oscillator = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();

                oscillator.type = 'sine';
                oscillator.frequency.setValueAtTime(140, audioCtx.currentTime);

                gainNode.gain.setValueAtTime(0.06, audioCtx.currentTime);
                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);

                oscillator.start();
                isAudioPlaying = true;
                document.getElementById('synth-text').innerText = "Pause Plasma Signal";
                document.getElementById('synth-icon').className = "fa-solid fa-pause text-xs";
            } else {
                if (oscillator) {
                    oscillator.stop();
                    oscillator.disconnect();
                }
                isAudioPlaying = false;
                document.getElementById('synth-text').innerText = "Play Plasma Audio Signal";
                document.getElementById('synth-icon').className = "fa-solid fa-play text-xs";
            }
        }

        function drawSpectrogram() {
            requestAnimationFrame(drawSpectrogram);
            if (!specCtx) return;

            specCtx.fillStyle = '#F8F7F2';
            specCtx.fillRect(0, 0, specCanvas.width, specCanvas.height);

            specCtx.beginPath();
            specCtx.lineWidth = 2;
            specCtx.strokeStyle = isAudioPlaying ? '#D95338' : '#787672';

            const time = Date.now() * 0.003;
            const sliceWidth = specCanvas.width / 40;
            let x = 0;

            for (let i = 0; i < 40; i++) {
                const amp = isAudioPlaying ? Math.sin(i * 0.2 + time) * 25 + Math.cos(i * 0.4 + time) * 15 : Math.sin(i * 0.1 + time) * 3;
                const y = specCanvas.height / 2 + amp;

                if (i === 0) specCtx.moveTo(x, y);
                else specCtx.lineTo(x, y);

                x += sliceWidth;
            }
            specCtx.stroke();
        }
        drawSpectrogram();

        // -------------------------------------------------------------
        // 4. MODAL HANDLERS & NAVIGATION HELPERS
        // Preserving window.openSolarModal & window.closeSolarModal
        // -------------------------------------------------------------
        window.openSolarModal = function(url) {
            const modal = document.getElementById('solar-system-modal');
            const iframe = document.getElementById('solar-iframe');
            if (modal && iframe) {
                iframe.src = url || 'solar-system/index.html';
                modal.classList.remove('opacity-0', 'pointer-events-none');
                modal.classList.add('opacity-100', 'pointer-events-auto');
            }
        };

        window.closeSolarModal = function() {
            const modal = document.getElementById('solar-system-modal');
            const iframe = document.getElementById('solar-iframe');
            if (modal && iframe) {
                iframe.src = '';
                modal.classList.add('opacity-0', 'pointer-events-none');
                modal.classList.remove('opacity-100', 'pointer-events-auto');
            }
        };

        function openRelicModal(id) {
            const modal = document.getElementById('relic-modal');
            if (modal) {
                document.getElementById('modal-title').innerText = "Relic Archival File";
                document.getElementById('modal-desc').innerText = "Telemetry and hardware specifications for artifact ID: " + id;
                modal.classList.remove('opacity-0', 'pointer-events-none');
                modal.classList.add('opacity-100', 'pointer-events-auto');
            }
        }

        function closeRelicModal() {
            const modal = document.getElementById('relic-modal');
            if (modal) {
                modal.classList.add('opacity-0', 'pointer-events-none');
                modal.classList.remove('opacity-100', 'pointer-events-auto');
            }
        }

        function scrollToArchive() {
            document.getElementById('archive-section').scrollIntoView({ behavior: 'smooth' });
        }

        // Viewport resize handling
        window.addEventListener('resize', () => {
            heroCamera.aspect = window.innerWidth / window.innerHeight;
            heroCamera.updateProjectionMatrix();
            heroRenderer.setSize(window.innerWidth, window.innerHeight);

            resizeCanvas();
            updateScrollProgress();
        });
    </script>

       Gemini cinematic UI remains unchanged.

  <script>
    /* Cinematic exhibition intro — UI-only presentation controller. */
    (function(){
      const intro=document.getElementById('intro-scroll');
      const scene=document.getElementById('sticky-scene');
      const saturn=document.getElementById('intro-planet');
      const sphere=document.getElementById('intro-planet-sphere');
      const orbit=document.getElementById('intro-planet-orbit');
      const rings=document.getElementById('intro-ring-details');
      const title=document.getElementById('intro-title');
      const eyebrow=document.getElementById('intro-eyebrow');
      const description=document.getElementById('intro-description');
      const actions=document.getElementById('intro-actions');
      const readout=document.getElementById('intro-readout');
      const marks=document.querySelectorAll('.intro-mark,.intro-section-number');
      const header=document.querySelector('body > header');
      const metadata=document.querySelector('body > aside[aria-label="Exhibit Metadata"]');

      if(!intro||!scene||!saturn||!sphere||!orbit||!rings||!title)return;

      let ticking=false;
      const clamp=(v,min,max)=>Math.min(Math.max(v,min),max);
      const smooth=(v)=>{const x=clamp(v,0,1);return x*x*(3-2*x);};
      const lerp=(a,b,t)=>a+(b-a)*clamp(t,0,1);

      function updateScene(){
        const scrollable=Math.max(intro.offsetHeight-window.innerHeight,1);
        const progress=clamp(-intro.getBoundingClientRect().top/scrollable,0,1);
        const mobile=window.innerWidth<=900;
        const small=window.innerWidth<=640;

        /* Saturn: centered at rest, then shifts right and shrinks. */
        const saturnShift=smooth((progress-.16)/.44);
        const x=lerp(0,small?16:(mobile?21:27),saturnShift);

        /* The hidden metadata/header still occupy normal document flow at the
           very first frame. Lift Saturn slightly so its visual center is the
           actual viewport center immediately on page load. It settles to the
           true center during the first small scroll movement. */
        const verticalSettle=smooth(progress/.12);
        const y=lerp(small?-4.5:-5.5,0,verticalSettle);

        const scale=lerp(1,small?.62:(mobile?.68:.62),saturnShift);
        saturn.style.transform=
          'translate3d('+x.toFixed(2)+'vw,'+y.toFixed(2)+'vh,0) scale('+scale.toFixed(3)+')';

        /* Scroll-linked planet rotation and independent ring-plane rotation. */
        sphere.style.transform='rotate('+(progress*360).toFixed(2)+'deg)';
        const ringAngle=lerp(-20,18,progress);
        orbit.style.transform='rotate('+ringAngle.toFixed(2)+'deg)';
        rings.style.transform='rotate('+ringAngle.toFixed(2)+'deg)';

        /* Title: invisible at load, rises into the fixed middle-left column. */
        const titleFade=smooth((progress-.025)/.30);
        const titleRise=smooth((progress-.025)/.32);
        title.style.setProperty('opacity',titleFade.toFixed(3),'important');
        title.style.setProperty('transform','translateY('+lerp(90,0,titleRise).toFixed(2)+'px)','important');

        /* Supporting copy follows the title with deliberate delays. */
        const eyebrowP=smooth((progress-.34)/.18);
        const descP=smooth((progress-.43)/.20);
        const actionsP=smooth((progress-.58)/.20);
        const readoutP=smooth((progress-.64)/.20);

        if(eyebrow){eyebrow.style.setProperty('opacity',eyebrowP.toFixed(3),'important');eyebrow.style.setProperty('transform','translateY('+lerp(20,0,eyebrowP).toFixed(2)+'px)','important');}
        if(description){description.style.setProperty('opacity',descP.toFixed(3),'important');description.style.setProperty('transform','translateY('+lerp(20,0,descP).toFixed(2)+'px)','important');}
        if(actions){actions.style.setProperty('opacity',actionsP.toFixed(3),'important');actions.style.setProperty('transform','translateY('+lerp(20,0,actionsP).toFixed(2)+'px)','important');}
        if(readout){readout.style.setProperty('opacity',readoutP.toFixed(3),'important');readout.style.setProperty('transform','translateY('+lerp(18,0,readoutP).toFixed(2)+'px)','important');}

        /* Page chrome returns only after the opening composition is established. */
        const chrome=smooth((progress-.72)/.22);
        if(header){header.style.setProperty('opacity',chrome.toFixed(3),'important');header.style.pointerEvents=chrome>.65?'auto':'none';}
        if(metadata){metadata.style.setProperty('opacity',chrome.toFixed(3),'important');metadata.style.pointerEvents=chrome>.65?'auto':'none';}

        const markP=smooth((progress-.78)/.16);
        marks.forEach(mark=>mark.style.setProperty('opacity',markP.toFixed(3),'important'));

        scene.style.pointerEvents=progress>.86?'auto':'none';
        ticking=false;
      }

      function requestUpdate(){
        if(!ticking){ticking=true;requestAnimationFrame(updateScene);}
      }

      window.addEventListener('scroll',requestUpdate,{passive:true});
      window.addEventListener('resize',requestUpdate);
      if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',updateScene);
      else updateScene();
      window.addEventListener('load',updateScene);
    })();
  </script>
